name: Stock Scanner - Golden Cross

on:
  schedule:
    # Senin - Jumat jam 16:50 WITA (08:50 UTC)
    - cron: '50 8 * * 1-5'
  workflow_dispatch: # Bisa manual run

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py
